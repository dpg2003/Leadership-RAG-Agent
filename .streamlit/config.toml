# Theme and behaviour for `leadership ui` (Streamlit reads this from the repo root).

[theme]
base = "light"
primaryColor = "#3B5BDB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6FA"
textColor = "#1F2933"
font = "sans serif"

[client]
showErrorDetails = "none"   # never show raw stack traces in the page
toolbarMode = "minimal"

[server]
headless = true             # no first-run email prompt, no auto-opened browser
address = "localhost"       # serve on this machine only (no Network/External URL)

[browser]
gatherUsageStats = false    # send no usage statistics

[runner]
magicEnabled = false
